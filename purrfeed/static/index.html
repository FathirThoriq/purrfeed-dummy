<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PurrFeed</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script src="/vendor/lucide.min.js"></script>
</head>
<body>
  <div class="loginPage">
    <header class="topbar">
      <div class="brand"><svg class="mascot" aria-hidden="true"><use href="/mascot-sprite.svg#purrFace"/></svg>PurrFeed</div>
      <button class="themeToggle" data-theme-toggle aria-label="Ganti tema"><i class="i-sun" data-lucide="sun"></i><i class="i-moon" data-lucide="moon"></i></button>
    </header>
    <main class="loginWrap">
      <section class="hero">
        <h1>Pantau feeder kucing &amp; anjingmu dari satu dashboard.</h1>
        <svg class="mascot" role="img" aria-label="Purr"><use href="/mascot-sprite.svg#purr"/></svg>
      </section>
      <form class="glass loginCard" id="form" novalidate>
        <h2>Masuk</h2>
        <label class="field">ID Alat
          <span class="inputIcon"><i data-lucide="scan-line" width="18" height="18"></i>
            <input type="text" id="code" placeholder="PF-8F3K2" autocomplete="off" spellcheck="false" maxlength="20"></span>
        </label>
        <fieldset class="pets">
          <legend>Hewan</legend>
          <label class="pet"><input type="radio" name="mode" value="kucing" checked><span><i data-lucide="cat"></i>Kucing</span></label>
          <label class="pet"><input type="radio" name="mode" value="anjing"><span><i data-lucide="dog"></i>Anjing</span></label>
        </fieldset>
        <p class="fieldError" id="msg" role="alert" hidden><i data-lucide="circle-alert" width="16" height="16"></i><span></span></p>
        <button class="btn primary" id="btn" type="submit"><i data-lucide="log-in" width="18" height="18"></i>Masuk Dashboard</button>
      </form>
    </main>
  </div>
  <script>
    const msg = document.getElementById('msg');
    const show = (text) => { msg.querySelector('span').textContent = text; msg.hidden = false; };
    document.getElementById('code').addEventListener('input', () => { msg.hidden = true; });
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('code').value.trim().toUpperCase();
      const mode = document.querySelector('input[name=mode]:checked').value;
      if (!code) { show('ID Alat wajib diisi.'); return; }
      const btn = document.getElementById('btn');
      btn.disabled = true;
      try {
        const r = await fetch('/api/devices/claim', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, mode }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error);
        location.href = '/dashboard?code=' + encodeURIComponent(code);
      } catch (err) {
        show(err.message || 'Server tidak terhubung.');
      } finally {
        btn.disabled = false;
      }
    });
    lucide.createIcons();
  </script>
</body>
</html>
