<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tes Kamera HP — PurrFeed</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script src="/vendor/lucide.min.js"></script>
<style>
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.card{padding:20px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=text]{width:100%;height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass-strong);color:var(--ink);font-weight:600}
#prev{width:100%;border-radius:14px;display:none}
#hasil{white-space:pre-wrap;font-size:13px;background:var(--glass-strong);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:80px}
.st{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar" style="display:flex;justify-content:space-between;align-items:center;padding:4px 0 14px">
<div class="brand"><svg class="mascot" aria-hidden="true" style="width:32px;height:28px"><use href="/mascot-sprite.svg#purr"/></svg>PurrFeed</div>
<button class="themeToggle" data-theme-toggle aria-label="Ganti tema"><i class="i-sun" data-lucide="sun"></i><i class="i-moon" data-lucide="moon"></i></button>
</header>
<main class="glass card">
<h1 style="font-size:20px">Tes Kamera HP</h1>
<p class="muted" style="margin:0;font-size:14px">Foto dari HP dikirim sebagai <b>PF-WGJ4A</b> dengan format yang sama seperti ESP32-CAM, jadi hasilnya muncul di tab ESP32-CAM dashboard. Halaman sementara untuk tes kualitas kamera.</p>
<div class="row">
<label class="field">ID Alat
<input type="text" id="code" value="PF-WGJ4A" maxlength="20" autocapitalize="characters" spellcheck="false">
</label>
<label class="field">Hewan
<select id="mode"><option value="kucing">Kucing</option><option value="anjing">Anjing</option></select>
</label>
</div>
<input type="file" id="pick" accept="image/*" capture="environment" hidden>
<button class="btn primary" id="snap" style="min-height:52px"><i data-lucide="camera"></i>Ambil Foto dan Kirim</button>
<p class="st" id="st"><i data-lucide="info"></i><span>Belum ada foto dikirim.</span></p>
<img id="prev" alt="Pratinjau foto terakhir">
<div id="hasil">Hasil klasifikasi tampil di sini.</div>
</main>
</div>
<script>
const $=s=>document.querySelector(s);
lucide.createIcons();
$('#snap').onclick=()=>$('#pick').click();
$('#pick').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  $('#prev').src=URL.createObjectURL(f); $('#prev').style.display='block';
  $('#st').querySelector('span').textContent='Mengirim...';
  const fd=new FormData();
  fd.set('code',$('#code').value.trim().toUpperCase());
  fd.set('mode',$('#mode').value);
  fd.set('source','esp32cam');
  fd.set('file',f,'hp.jpg');
  try{
    const r=await fetch('/api/predict',{method:'POST',body:fd});
    const j=await r.json();
    $('#hasil').textContent=JSON.stringify(j,null,1);
    $('#st').querySelector('span').textContent=r.ok?('Terkirim '+j.jam+' — lihat tab ESP32-CAM di dashboard.'):('Gagal: '+(j.error||r.status));
  }catch(err){ $('#st').querySelector('span').textContent='Server tidak terhubung.'; }
  e.target.value='';
};
</script>
</body>
</html>
